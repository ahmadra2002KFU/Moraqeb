<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MORAQEB — Voice Intelligence</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020408;--panel:rgba(6,14,22,0.82);--glass:rgba(10,20,32,0.55);
  --border:rgba(100,240,200,0.12);--border-bright:rgba(100,240,200,0.3);
  --text:#e8f4f0;--dim:#6a8a82;--accent:#64f0c8;--accent2:#44ccff;
  --warn:#ffb84c;--danger:#ff5f63;
  --mono:'IBM Plex Mono',monospace;--sans:'Space Grotesk',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}

/* ── Animated background ─────────────────────────────── */
.bg-radial{position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(40,120,100,0.12),transparent 55%),
    radial-gradient(ellipse at 80% 20%,rgba(40,100,180,0.06),transparent 40%);
  animation:bgShift 20s ease-in-out infinite alternate}
@keyframes bgShift{
  0%{background-position:0% 0%,100% 0%}
  50%{background-position:30% 10%,60% 30%}
  100%{background-position:0% 0%,100% 0%}
}
.bg-grid{position:fixed;inset:0;pointer-events:none;opacity:0.4;
  background-image:linear-gradient(rgba(100,240,200,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(100,240,200,0.03) 1px,transparent 1px);
  background-size:60px 60px;mask-image:radial-gradient(ellipse at 50% 30%,black 20%,transparent 70%)}
.scanline{position:fixed;inset:0;pointer-events:none;overflow:hidden;opacity:0.5}
.scanline::after{content:'';position:absolute;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,rgba(100,240,200,0.10),transparent);animation:scanMove 4s linear infinite}
@keyframes scanMove{0%{top:-2px}100%{top:100%}}

/* ── Topbar ──────────────────────────────────────────── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border:1px solid var(--border);background:var(--panel);backdrop-filter:blur(20px);flex-wrap:wrap;gap:10px;position:relative;z-index:10}
.top-left{display:flex;align-items:center;gap:14px}
.brand{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);text-decoration:none}
.nav-links{display:flex;align-items:center;gap:6px}
.nav-link{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;padding:5px 12px;border:1px solid var(--border);color:var(--dim);background:rgba(255,255,255,0.02);text-decoration:none;transition:all 0.2s;cursor:pointer}
.nav-link:hover{border-color:var(--accent);color:var(--text)}
.nav-link.active{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:600}
.top-right{display:flex;align-items:center;gap:10px}
.status-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;border:1px solid var(--border);color:var(--dim)}
.status-chip .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.status-chip .dot.connected{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.status-chip .dot.disconnected{background:var(--danger);box-shadow:0 0 8px var(--danger)}

/* ── Main layout ─────────────────────────────────────── */
.voice-container{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:calc(100vh - 70px);padding:40px 20px 30px;position:relative;z-index:1}

/* ── Orb ─────────────────────────────────────────────── */
.orb-wrapper{position:relative;width:240px;height:240px;margin-bottom:32px;flex-shrink:0}
.orb-bg{position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(100,240,200,0.04),transparent 70%);filter:blur(20px);transition:opacity 0.5s}
.orb-ring-outer{position:absolute;inset:-20px;border:1px solid rgba(100,240,200,0.06);border-radius:50%;animation:spin 12s linear infinite}
.orb-ring-mid{position:absolute;inset:-10px;border:1px solid rgba(100,240,200,0.08);border-radius:50%;animation:spin 8s linear infinite reverse}
.orb{width:240px;height:240px;border-radius:50%;border:2px solid rgba(100,240,200,0.2);background:radial-gradient(circle at 40% 35%,rgba(20,50,45,0.6),rgba(4,10,18,0.9));position:relative;display:flex;align-items:center;justify-content:center;transition:border-color 0.3s,box-shadow 0.3s;overflow:hidden}
.orb::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(100,240,200,0.03),transparent 60%);animation:orbPulseIdle 4s ease-in-out infinite}
.orb-label{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:0.2em;color:rgba(100,240,200,0.35);z-index:2;user-select:none;transition:color 0.3s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes orbPulseIdle{0%,100%{transform:scale(1);opacity:0.5}50%{transform:scale(1.02);opacity:1}}

/* Orb ripple effect */
.orb-ripple{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.orb-ripple span{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(100,240,200,0.15);animation:rippleOut 2s ease-out infinite;opacity:0}
.orb-ripple span:nth-child(2){animation-delay:0.6s}
.orb-ripple span:nth-child(3){animation-delay:1.2s}
@keyframes rippleOut{0%{transform:scale(0.95);opacity:0.4}100%{transform:scale(1.4);opacity:0}}

/* State: connecting */
.orb-wrapper.connecting .orb{border-color:rgba(68,204,255,0.3);box-shadow:0 0 30px rgba(68,204,255,0.1)}
.orb-wrapper.connecting .orb-ring-outer{border-color:rgba(68,204,255,0.2);border-top-color:var(--accent2);animation-duration:1.5s}
.orb-wrapper.connecting .orb-ring-mid{border-color:rgba(68,204,255,0.15);border-bottom-color:var(--accent2);animation-duration:1s}
.orb-wrapper.connecting .orb-label{color:rgba(68,204,255,0.5)}
.orb-wrapper.connecting .orb-bg{opacity:0.6}

/* State: listening */
.orb-wrapper.listening .orb{border-color:rgba(100,240,200,0.35);box-shadow:0 0 40px rgba(100,240,200,0.08)}
.orb-wrapper.listening .orb-label{color:rgba(100,240,200,0.6)}
.orb-wrapper.listening .orb-bg{opacity:0.8}

/* State: speaking */
.orb-wrapper.speaking .orb{border-color:rgba(100,240,200,0.6);box-shadow:0 0 60px rgba(100,240,200,0.15),0 0 120px rgba(100,240,200,0.05)}
.orb-wrapper.speaking .orb-label{color:var(--accent)}
.orb-wrapper.speaking .orb-bg{opacity:1}
.orb-wrapper.speaking .orb-ripple span{animation-duration:1.4s}

/* State: muted */
.orb-wrapper.muted .orb{border-color:rgba(255,255,255,0.08);box-shadow:none}
.orb-wrapper.muted .orb-label{color:rgba(255,255,255,0.15)}
.orb-wrapper.muted .orb-bg{opacity:0.2}
.orb-wrapper.muted .orb::before{animation:none;opacity:0.2}

/* ── Status text ─────────────────────────────────────── */
.status-text{font-family:var(--mono);font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:var(--dim);margin-bottom:28px;min-height:22px;transition:color 0.3s}
.status-text.active{color:var(--accent)}
.status-text.speaking{color:var(--accent);text-shadow:0 0 12px rgba(100,240,200,0.3)}

/* ── Transcript ──────────────────────────────────────── */
.transcript-panel{width:100%;max-width:640px;flex:1;min-height:120px;max-height:340px;overflow-y:auto;border:1px solid var(--border);background:var(--glass);backdrop-filter:blur(16px);padding:16px;margin-bottom:24px;position:relative;font-family:var(--mono);font-size:12px;line-height:1.8}
.transcript-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(100,240,200,0.15),transparent);pointer-events:none}
.transcript-panel::-webkit-scrollbar{width:4px}
.transcript-panel::-webkit-scrollbar-track{background:transparent}
.transcript-panel::-webkit-scrollbar-thumb{background:rgba(100,240,200,0.15);border-radius:2px}
.t-entry{margin-bottom:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);unicode-bidi:plaintext}
.t-entry:last-child{border-bottom:none}
.t-label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:2px}
.t-label.user{color:var(--accent2)}
.t-label.ai{color:var(--accent)}
.t-text{color:var(--text);opacity:0.85;unicode-bidi:plaintext;text-align:start}
.t-text.dim{color:var(--dim);font-style:italic;opacity:0.6}
.t-empty{color:var(--dim);opacity:0.4;text-align:center;padding:30px 0;letter-spacing:0.1em;font-size:11px}

/* ── Mic button ──────────────────────────────────────── */
.mic-area{display:flex;flex-direction:column;align-items:center;gap:12px;flex-shrink:0}
.mic-btn{width:72px;height:72px;border-radius:50%;border:2px solid var(--accent);background:rgba(100,240,200,0.06);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s;position:relative;outline:none}
.mic-btn:hover{background:rgba(100,240,200,0.12);box-shadow:0 0 30px rgba(100,240,200,0.1)}
.mic-btn.active{background:rgba(100,240,200,0.15);box-shadow:0 0 40px rgba(100,240,200,0.12)}
.mic-btn.active .mic-icon{fill:var(--accent)}
.mic-btn.muted{border-color:rgba(255,95,99,0.4);background:rgba(255,95,99,0.06)}
.mic-btn.muted:hover{background:rgba(255,95,99,0.12)}
.mic-btn.muted .mic-icon{fill:var(--danger);opacity:0.6}
.mic-btn.muted .mic-slash{display:block}
.mic-icon{width:28px;height:28px;fill:rgba(100,240,200,0.5);transition:fill 0.3s}
.mic-slash{display:none;position:absolute;width:36px;height:2px;background:var(--danger);transform:rotate(-45deg);border-radius:1px}
.mic-hint{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:0.08em;text-transform:uppercase}

/* ── Volume meter (thin line under orb) ──────────────── */
.vol-meter{width:120px;height:3px;background:rgba(100,240,200,0.08);border-radius:2px;overflow:hidden;margin-bottom:8px}
.vol-meter-fill{height:100%;width:0%;background:var(--accent);border-radius:2px;transition:width 0.06s linear;box-shadow:0 0 6px rgba(100,240,200,0.3)}
.vol-meter.ai .vol-meter-fill{background:var(--accent2);box-shadow:0 0 6px rgba(68,204,255,0.3)}

/* ── Responsive ──────────────────────────────────────── */
@media(max-width:640px){
  .topbar{padding:10px 12px}
  .brand{font-size:13px}
  .nav-link{font-size:10px;padding:4px 8px}
  .orb-wrapper{width:180px;height:180px}
  .orb{width:180px;height:180px}
  .orb-label{font-size:16px}
  .voice-container{padding:24px 12px 20px}
  .transcript-panel{max-height:200px;font-size:11px}
  .mic-btn{width:62px;height:62px}
}
</style>
</head>
<body>
<div class="bg-radial"></div>
<div class="bg-grid"></div>
<div class="scanline"></div>

<!-- ── Topbar ──────────────────────────────────────── -->
<div class="topbar">
  <div class="top-left">
    <a href="/" class="brand"><img src="/logo-header.png" alt="Moraqeb" style="height:28px;vertical-align:middle"></a>
    <nav class="nav-links">
      <a href="/" class="nav-link">Dashboard</a>
      <a href="/chat" class="nav-link">Chat</a>
      <a href="/voice.html" class="nav-link active">Voice</a>
      <a href="/blog" class="nav-link">Blog</a>
    </nav>
  </div>
  <div class="top-right">
    <span class="status-chip">
      <span class="dot disconnected" id="connDot"></span>
      <span id="connLabel">OFFLINE</span>
    </span>
  </div>
</div>

<!-- ── Voice interface ────────────────────────────── -->
<div class="voice-container">

  <!-- Orb -->
  <div class="orb-wrapper" id="orbWrapper">
    <div class="orb-bg"></div>
    <div class="orb-ring-outer"></div>
    <div class="orb-ring-mid"></div>
    <div class="orb">
      <span class="orb-label">MQ</span>
      <div class="orb-ripple"><span></span><span></span><span></span></div>
    </div>
  </div>

  <!-- Volume meters -->
  <div class="vol-meter" id="micMeter"><div class="vol-meter-fill" id="micMeterFill"></div></div>

  <!-- Status -->
  <div class="status-text" id="statusText">TAP TO START</div>

  <!-- Transcript -->
  <div class="transcript-panel" id="transcript">
    <div class="t-empty">Voice transcript will appear here</div>
  </div>

  <!-- Mic button -->
  <div class="mic-area">
    <button class="mic-btn" id="micBtn" title="Toggle microphone">
      <svg class="mic-icon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      <span class="mic-slash"></span>
    </button>
    <span class="mic-hint" id="micHint">Click to start</span>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
// MORAQEB VOICE ASSISTANT — Client
// ══════════════════════════════════════════════════════════

const $ = id => document.getElementById(id);

// DOM refs
const orbWrapper = $('orbWrapper');
const statusText = $('statusText');
const micBtn = $('micBtn');
const micHint = $('micHint');
const transcript = $('transcript');
const connDot = $('connDot');
const connLabel = $('connLabel');
const micMeterFill = $('micMeterFill');

// ── State ─────────────────────────────────────────────────
let ws = null;
let audioCtx = null;
let micStream = null;
let micProcessor = null;       // worklet or script processor
let micSource = null;
let analyserNode = null;
let isListening = false;       // mic active and sending
let isMuted = false;           // user toggled mute
let isSpeaking = false;        // AI is speaking
let isConnected = false;
let playQueue = [];            // queued AudioBuffers for seamless playback
let nextPlayTime = 0;          // when to schedule next buffer
let currentState = 'idle';     // idle | connecting | listening | speaking | muted

// Speech recognition for transcript (optional)
let recognition = null;
let recognitionActive = false;

// ── Audio Constants ───────────────────────────────────────
const MIC_SAMPLE_RATE = 16000;
const PLAYBACK_SAMPLE_RATE = 24000;
const CHUNK_DURATION_MS = 250;
const CHUNK_SAMPLES = MIC_SAMPLE_RATE * CHUNK_DURATION_MS / 1000; // 4000

// ── WebSocket ─────────────────────────────────────────────
function connectWS() {
  setState('connecting');
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/api/voice`;

  ws = new WebSocket(url);

  ws.onopen = () => {
    isConnected = true;
    connDot.className = 'dot connected';
    connLabel.textContent = 'CONNECTED';
    // If mic was already active, go to listening, otherwise idle
    if (isListening && !isMuted) {
      setState('listening');
    } else {
      setState('idle');
    }
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'audio') {
        handleAudioReceive(msg.data);
        if (currentState !== 'speaking') setState('speaking');
      } else if (msg.type === 'turnComplete') {
        isSpeaking = false;
        if (isListening && !isMuted) {
          setState('listening');
        } else {
          setState(isMuted ? 'muted' : 'idle');
        }
        addTranscriptEntry('ai', null, true); // mark end of AI turn
      }
    } catch { /* ignore parse errors */ }
  };

  ws.onclose = () => {
    isConnected = false;
    connDot.className = 'dot disconnected';
    connLabel.textContent = 'OFFLINE';
    // Reconnect after delay
    setTimeout(() => {
      if (!isConnected) connectWS();
    }, 3000);
  };

  ws.onerror = () => { /* onclose will handle reconnect */ };
}

// ── State Machine ─────────────────────────────────────────
function setState(state) {
  currentState = state;
  orbWrapper.className = 'orb-wrapper ' + state;

  const labels = {
    idle: 'TAP TO START',
    connecting: 'CONNECTING...',
    listening: 'LISTENING...',
    speaking: 'MORAQEB IS SPEAKING...',
    muted: 'MICROPHONE MUTED',
  };
  statusText.textContent = labels[state] || '';
  statusText.className = 'status-text' + (state === 'listening' ? ' active' : '') + (state === 'speaking' ? ' speaking' : '');
}

// ── Mic Capture ───────────────────────────────────────────
async function startMic() {
  if (micStream) return;

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  } catch (err) {
    console.error('[Moraqeb Voice] Mic access denied:', err);
    addTranscriptEntry('system', 'Microphone access denied. Please allow microphone access and try again.');
    return;
  }

  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  const nativeRate = audioCtx.sampleRate;
  micSource = audioCtx.createMediaStreamSource(micStream);

  // AnalyserNode for visual volume
  analyserNode = audioCtx.createAnalyser();
  analyserNode.fftSize = 256;
  micSource.connect(analyserNode);

  // Accumulation buffer for chunking
  let pcmBuffer = new Float32Array(0);

  // Try AudioWorklet first, fall back to ScriptProcessor
  let useWorklet = false;
  if (audioCtx.audioWorklet) {
    try {
      const workletCode = `
        class PcmProcessor extends AudioWorkletProcessor {
          constructor() { super(); this.buffer = []; }
          process(inputs) {
            const input = inputs[0];
            if (input && input[0]) {
              const samples = new Float32Array(input[0]);
              this.port.postMessage({ samples });
            }
            return true;
          }
        }
        registerProcessor('pcm-processor', PcmProcessor);
      `;
      const blob = new Blob([workletCode], { type: 'application/javascript' });
      const blobUrl = URL.createObjectURL(blob);
      await audioCtx.audioWorklet.addModule(blobUrl);
      URL.revokeObjectURL(blobUrl);

      const workletNode = new AudioWorkletNode(audioCtx, 'pcm-processor');
      micSource.connect(workletNode);
      workletNode.connect(audioCtx.destination); // needed to keep processing alive (silent)

      workletNode.port.onmessage = (e) => {
        if (!isListening || isMuted) return;
        const samples = e.data.samples;
        // Merge into buffer
        const merged = new Float32Array(pcmBuffer.length + samples.length);
        merged.set(pcmBuffer);
        merged.set(samples, pcmBuffer.length);
        pcmBuffer = merged;

        // When we have enough samples for a chunk
        const samplesNeeded = Math.ceil(CHUNK_SAMPLES * (nativeRate / MIC_SAMPLE_RATE));
        while (pcmBuffer.length >= samplesNeeded) {
          const chunk = pcmBuffer.slice(0, samplesNeeded);
          pcmBuffer = pcmBuffer.slice(samplesNeeded);
          const downsampled = downsample(chunk, nativeRate, MIC_SAMPLE_RATE);
          const b64 = float32ToPcm16Base64(downsampled);
          sendAudioChunk(b64);
        }
      };

      micProcessor = workletNode;
      useWorklet = true;
    } catch (err) {
      console.warn('[Moraqeb Voice] AudioWorklet failed, using ScriptProcessor:', err.message);
    }
  }

  if (!useWorklet) {
    // Fallback: ScriptProcessorNode (deprecated but widely supported)
    const bufSize = 4096;
    const scriptNode = audioCtx.createScriptProcessor(bufSize, 1, 1);

    scriptNode.onaudioprocess = (e) => {
      if (!isListening || isMuted) return;
      const input = e.inputBuffer.getChannelData(0);
      const samples = new Float32Array(input);

      const merged = new Float32Array(pcmBuffer.length + samples.length);
      merged.set(pcmBuffer);
      merged.set(samples, pcmBuffer.length);
      pcmBuffer = merged;

      const samplesNeeded = Math.ceil(CHUNK_SAMPLES * (nativeRate / MIC_SAMPLE_RATE));
      while (pcmBuffer.length >= samplesNeeded) {
        const chunk = pcmBuffer.slice(0, samplesNeeded);
        pcmBuffer = pcmBuffer.slice(samplesNeeded);
        const downsampled = downsample(chunk, nativeRate, MIC_SAMPLE_RATE);
        const b64 = float32ToPcm16Base64(downsampled);
        sendAudioChunk(b64);
      }
    };

    micSource.connect(scriptNode);
    scriptNode.connect(audioCtx.destination);
    micProcessor = scriptNode;
  }

  isListening = true;
  isMuted = false;
  micBtn.classList.add('active');
  micBtn.classList.remove('muted');
  micHint.textContent = 'Listening — click to mute';
  if (isConnected) setState('listening');

  startVolumeMeter();
  startSpeechRecognition();
}

function stopMic() {
  isListening = false;
  if (micStream) {
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
  }
  if (micProcessor) {
    micProcessor.disconnect();
    micProcessor = null;
  }
  if (micSource) {
    micSource.disconnect();
    micSource = null;
  }
  analyserNode = null;
  micBtn.classList.remove('active');
  micBtn.classList.remove('muted');
  micHint.textContent = 'Click to start';
  micMeterFill.style.width = '0%';
  stopSpeechRecognition();
  setState('idle');
}

function toggleMute() {
  if (!isListening) {
    // Start everything
    startMic();
    if (!isConnected) connectWS();
    return;
  }

  isMuted = !isMuted;
  if (isMuted) {
    micBtn.classList.add('muted');
    micBtn.classList.remove('active');
    micHint.textContent = 'Muted — click to unmute';
    micMeterFill.style.width = '0%';
    setState('muted');
    stopSpeechRecognition();
  } else {
    micBtn.classList.remove('muted');
    micBtn.classList.add('active');
    micHint.textContent = 'Listening — click to mute';
    if (isConnected && !isSpeaking) setState('listening');
    startSpeechRecognition();
  }
}

micBtn.addEventListener('click', toggleMute);

// ── Audio Conversion ──────────────────────────────────────

/** Downsample Float32 audio from srcRate to dstRate */
function downsample(samples, srcRate, dstRate) {
  if (srcRate === dstRate) return samples;
  const ratio = srcRate / dstRate;
  const outLen = Math.floor(samples.length / ratio);
  const out = new Float32Array(outLen);

  if (srcRate % dstRate === 0) {
    // Exact integer ratio — take every Nth sample
    const step = srcRate / dstRate;
    for (let i = 0; i < outLen; i++) {
      out[i] = samples[i * step | 0];
    }
  } else {
    // Linear interpolation
    for (let i = 0; i < outLen; i++) {
      const srcIdx = i * ratio;
      const lo = srcIdx | 0;
      const hi = Math.min(lo + 1, samples.length - 1);
      const frac = srcIdx - lo;
      out[i] = samples[lo] * (1 - frac) + samples[hi] * frac;
    }
  }
  return out;
}

/** Convert Float32 [-1,1] to 16-bit PCM LE, then base64 */
function float32ToPcm16Base64(float32) {
  const len = float32.length;
  const buf = new ArrayBuffer(len * 2);
  const view = new DataView(buf);
  for (let i = 0; i < len; i++) {
    let s = Math.max(-1, Math.min(1, float32[i]));
    s = s < 0 ? s * 0x8000 : s * 0x7FFF;
    view.setInt16(i * 2, s, true); // little-endian
  }
  // ArrayBuffer to base64
  const bytes = new Uint8Array(buf);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}

function sendAudioChunk(base64) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'audio', data: base64 }));
  }
}

// ── Audio Playback ────────────────────────────────────────

function handleAudioReceive(base64Pcm) {
  isSpeaking = true;

  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  // Decode base64 -> Int16 PCM -> Float32
  const binary = atob(base64Pcm);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

  const int16 = new Int16Array(bytes.buffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) {
    float32[i] = int16[i] / 0x8000;
  }

  // Create AudioBuffer at 24kHz
  const audioBuf = audioCtx.createBuffer(1, float32.length, PLAYBACK_SAMPLE_RATE);
  audioBuf.getChannelData(0).set(float32);

  // Queue for seamless playback
  queuePlayback(audioBuf);
}

function queuePlayback(audioBuf) {
  const now = audioCtx.currentTime;
  if (nextPlayTime < now) nextPlayTime = now;

  const src = audioCtx.createBufferSource();
  src.buffer = audioBuf;

  // Create analyser for output volume visualization
  const outAnalyser = audioCtx.createAnalyser();
  outAnalyser.fftSize = 256;
  src.connect(outAnalyser);
  outAnalyser.connect(audioCtx.destination);

  src.start(nextPlayTime);
  nextPlayTime += audioBuf.duration;

  // Animate orb while playing
  const data = new Uint8Array(outAnalyser.frequencyBinCount);
  function animateOut() {
    if (!isSpeaking) return;
    outAnalyser.getByteFrequencyData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++) sum += data[i];
    const avg = sum / data.length / 255;
    updateOrbGlow(avg, true);
    requestAnimationFrame(animateOut);
  }
  animateOut();

  src.onended = () => {
    // If no more buffers queued after this, reset
    if (audioCtx.currentTime >= nextPlayTime - 0.05) {
      updateOrbGlow(0, true);
    }
  };
}

// ── Volume Meter + Orb Animation ──────────────────────────
let volumeRAF = null;
function startVolumeMeter() {
  if (volumeRAF) return;
  function tick() {
    volumeRAF = requestAnimationFrame(tick);
    if (!analyserNode || isMuted) {
      micMeterFill.style.width = '0%';
      return;
    }
    const data = new Uint8Array(analyserNode.frequencyBinCount);
    analyserNode.getByteFrequencyData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++) sum += data[i];
    const avg = sum / data.length / 255;
    micMeterFill.style.width = (avg * 100).toFixed(1) + '%';
    // Update orb based on mic volume when listening
    if (currentState === 'listening') {
      updateOrbGlow(avg, false);
    }
  }
  tick();
}

function updateOrbGlow(volume, isOutput) {
  const orb = orbWrapper.querySelector('.orb');
  if (!orb) return;

  const intensity = Math.min(1, volume * 2.5); // amplify for visual effect
  if (isOutput) {
    // AI speaking: accent glow
    const glow = 20 + intensity * 80;
    const borderAlpha = 0.3 + intensity * 0.5;
    orb.style.boxShadow = `0 0 ${glow}px rgba(100,240,200,${(0.1 + intensity * 0.2).toFixed(2)}), 0 0 ${glow * 2}px rgba(100,240,200,${(intensity * 0.08).toFixed(2)})`;
    orb.style.borderColor = `rgba(100,240,200,${borderAlpha.toFixed(2)})`;
    orb.style.transform = `scale(${(1 + intensity * 0.03).toFixed(3)})`;
  } else {
    // Mic input: subtle responsiveness
    const glow = 15 + intensity * 40;
    const borderAlpha = 0.2 + intensity * 0.25;
    orb.style.boxShadow = `0 0 ${glow}px rgba(100,240,200,${(0.05 + intensity * 0.1).toFixed(2)})`;
    orb.style.borderColor = `rgba(100,240,200,${borderAlpha.toFixed(2)})`;
    orb.style.transform = `scale(${(1 + intensity * 0.015).toFixed(3)})`;
  }
}

// ── Transcript ────────────────────────────────────────────
let lastTranscriptType = null;
let aiTurnActive = false;

function addTranscriptEntry(type, text, endTurn) {
  // Remove empty placeholder
  const empty = transcript.querySelector('.t-empty');
  if (empty) empty.remove();

  if (type === 'ai' && endTurn) {
    // End of AI speaking turn
    if (aiTurnActive) {
      const last = transcript.querySelector('.t-entry:last-child .t-text');
      if (last && last.classList.contains('dim')) {
        last.textContent = '[AI finished speaking]';
      }
    }
    aiTurnActive = false;
    return;
  }

  if (type === 'ai' && !aiTurnActive) {
    // Start of AI speaking
    aiTurnActive = true;
    const entry = document.createElement('div');
    entry.className = 't-entry';
    entry.innerHTML = `<div class="t-label ai">MORAQEB</div><div class="t-text dim" dir="auto">Speaking...</div>`;
    transcript.appendChild(entry);
    transcript.scrollTop = transcript.scrollHeight;
    return;
  }

  if (type === 'user' && text) {
    aiTurnActive = false;
    const entry = document.createElement('div');
    entry.className = 't-entry';
    entry.innerHTML = `<div class="t-label user">YOU</div><div class="t-text" dir="auto">${escapeHtml(text)}</div>`;
    transcript.appendChild(entry);
    transcript.scrollTop = transcript.scrollHeight;
  }

  if (type === 'system' && text) {
    const entry = document.createElement('div');
    entry.className = 't-entry';
    entry.innerHTML = `<div class="t-text dim" dir="auto">${escapeHtml(text)}</div>`;
    transcript.appendChild(entry);
    transcript.scrollTop = transcript.scrollHeight;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── Speech Recognition (optional, for transcript) ────────
function startSpeechRecognition() {
  if (recognitionActive) return;
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return;

  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const text = e.results[i][0].transcript.trim();
        if (text) addTranscriptEntry('user', text);
      }
    }
  };

  recognition.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-available') {
      recognitionActive = false;
      return;
    }
    // Auto-restart on transient errors
    if (recognitionActive && isListening && !isMuted) {
      try { recognition.start(); } catch { /* already started */ }
    }
  };

  recognition.onend = () => {
    // Restart if still active
    if (recognitionActive && isListening && !isMuted) {
      try { recognition.start(); } catch { /* ignore */ }
    }
  };

  try {
    recognition.start();
    recognitionActive = true;
  } catch { /* ignore */ }
}

function stopSpeechRecognition() {
  recognitionActive = false;
  if (recognition) {
    try { recognition.stop(); } catch { /* ignore */ }
    recognition = null;
  }
}

// ── Keyboard shortcut ─────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target === document.body) {
    e.preventDefault();
    toggleMute();
  }
});

connectWS();
